<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fdf2f8, #eef2ff);
      min-height: 100vh; color: #1f2937; padding: 24px 16px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { text-align: center; color: #9333ea; margin-bottom: 20px; }
    h2.section { margin: 28px 0 12px; color: #4b5563; font-size: 1.1rem; }
    form {
      background: #fff; border-radius: 14px; padding: 18px;
      box-shadow: 0 4px 14px rgba(147, 51, 234, .12);
      display: grid; gap: 12px; max-width: 560px; margin: 0 auto;
    }
    label { font-weight: 600; font-size: .9rem; display: grid; gap: 6px; }
    input, textarea {
      width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 10px;
      font: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: #a855f7; box-shadow: 0 0 0 3px #f3e8ff; }
    textarea { resize: vertical; min-height: 80px; }
    button {
      border: none; background: #9333ea; color: #fff; font: inherit; font-weight: 600;
      padding: 12px; border-radius: 10px; cursor: pointer;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #b91c1c; text-align: center; margin-top: 10px; }
    #preview { max-width: 560px; margin: 24px auto 0; }
    #cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card {
      background: #fff; border-radius: 16px; padding: 22px; text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
    }
    .avatar {
      width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px;
      display: grid; place-items: center; color: #fff; font-size: 1.6rem; font-weight: 700;
    }
    .card h2 { margin-bottom: 6px; word-break: break-word; }
    .bio { color: #4b5563; margin-bottom: 12px; word-break: break-word; }
    .skills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }
    .skill { background: #f3e8ff; color: #7e22ce; padding: 4px 10px; border-radius: 999px; font-size: .8rem; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .links a { color: #4f46e5; font-size: .85rem; text-decoration: none; border-bottom: 1px dashed #4f46e5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪪 Profile Card Generator</h1>

    <form id="profile-form">
      <label>Name
        <input name="name" type="text" maxlength="60" placeholder="e.g. jane doe" required />
      </label>
      <label>Bio
        <textarea name="bio" maxlength="300" placeholder="Tell us about yourself..." required></textarea>
      </label>
      <label>Skills (comma separated)
        <input name="skills" type="text" placeholder="JavaScript, Node.js, CSS" />
      </label>
      <label>Social links (comma or new line separated)
        <textarea name="links" placeholder="github.com/yourname, linkedin.com/in/yourname"></textarea>
      </label>
      <button type="submit" id="submit-btn">Generate Card</button>
      <div id="form-error" class="error" hidden></div>
    </form>

    <div id="preview"></div>

    <h2 class="section">Saved profiles</h2>
    <div id="cards"></div>
  </div>

  <script>
    const form = document.getElementById("profile-form");
    const preview = document.getElementById("preview");
    const cards = document.getElementById("cards");
    const errorEl = document.getElementById("form-error");
    const btn = document.getElementById("submit-btn");

    async function loadCards() {
      try {
        const res = await fetch("/profiles");
        cards.innerHTML = (await res.text()) || '<p>No profiles yet.</p>';
      } catch {
        cards.innerHTML = '<p class="error">Could not load profiles.</p>';
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      btn.disabled = true;
      try {
        const body = new URLSearchParams(new FormData(form));
        const res = await fetch("/profiles", { method: "POST", body });
        const html = await res.text();
        if (!res.ok) {
          errorEl.innerHTML = html;
          errorEl.hidden = false;
          return;
        }
        preview.innerHTML = html;
        form.reset();
        loadCards();
      } catch {
        errorEl.textContent = "Network error. Please try again.";
        errorEl.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });

    loadCards();
  </script>
</body>
</html>
